# Catálogo FIXO de tarefas do benchmark (commit base ac48dc5).
# RASCUNHO para validação do dono do Atena: cada tarefa nasce de um problema observado no código
# (ver docs/ATENA_BASELINE.md). Ordem pensada para reduzir dependência entre tarefas.
# Não exponha aqui o oráculo: os checks ocultos medem o resultado sem estar descritos às LLMs.
tasks:
  - id: T-001
    title: Parametrizar SQL montado com entrada do usuário nas buscas e no calendário
    requirements: [REQ-009]
    description: >
      As buscas das listagens interpolam `$_POST['busca']` diretamente no SQL, e a ação `puxar`
      do calendário interpola `$_POST['data']`. Substituir por consultas parametrizadas,
      preservando o comportamento de busca (LIKE por nome, matrícula, email e CPF quando aplicável).
    expected_behavior:
      - A busca retorna os mesmos registros que retornava para entradas legítimas.
      - Entradas com aspas ou SQL não alteram a consulta executada.
    likely_files:
      - Views/pages/listagem-alunos.php
      - Views/pages/listagem-professores.php
      - Views/pages/listagem-sectarios.php
      - Views/pages/chat.php
      - Models/ajax/Calendario.php
    acceptance:
      - Nenhuma variável de entrada é interpolada ou concatenada em SQL nesses arquivos.
      - Testes automatizados cobrem a montagem da consulta de busca sem depender de banco real.

  - id: T-002
    title: Validar uploads pelo tipo real e impedir extensão executável
    requirements: [REQ-005, REQ-009]
    description: >
      `MainMolde::upload()` valida a extensão por `$formatoArquivo[1]`, mas grava o arquivo com a
      última extensão do nome: `x.pdf.php` passa na validação e é salvo como `.php` dentro de
      `Views/uploads/`. `uploadFile()` e `ajax/CadastroUnidadeEscolar.php` não validam nada.
      Centralizar a validação: allowlist de extensão (pela última extensão), tipo real via finfo,
      tamanho máximo e nome gerado pelo servidor.
    expected_behavior:
      - Tipos hoje aceitos (pdf, doc, zip, rar para materiais; imagens para fotos) continuam aceitos.
      - Arquivo com extensão final não permitida ou tipo real divergente é recusado com a mesma
        mensagem de erro já exibida ao usuário.
    likely_files:
      - Models/MainMolde.php
      - Models/ajax/CadastroUnidadeEscolar.php
    acceptance:
      - Nenhum caminho de upload grava arquivo sem passar pela validação central.
      - Testes cobrem extensão dupla, extensão em maiúsculas, tipo real divergente e tamanho.

  - id: T-003
    title: Exigir sessão autenticada e perfil nos endpoints de Models/ajax
    requirements: [REQ-001, REQ-009]
    description: >
      Endpoints em `Models/ajax/` são acessados diretamente por HTTP (fora do Router) e vários não
      verificam sessão nem perfil. Exigir sessão válida e o perfil compatível com a ação em todos
      eles, respondendo 403 em JSON quando não autorizado.
    expected_behavior:
      - Usuário autenticado com perfil correto mantém exatamente o comportamento atual.
      - Requisição sem sessão ou com perfil incorreto recebe 403 e nenhum efeito colateral.
    likely_files:
      - Models/ajax/*.php
    acceptance:
      - Todos os arquivos de Models/ajax passam por uma verificação de autorização única e explícita.
      - O mapeamento endpoint → perfis permitidos está declarado em um único lugar.
      - Testes cobrem acesso sem sessão e com perfil incorreto.

  - id: T-004
    title: Substituir md5 de senha por password_hash com migração transparente
    requirements: [REQ-001, REQ-009]
    description: >
      Login e cadastros usam `md5()` para senha. Passar a gravar com `password_hash` e validar com
      `password_verify`, aceitando hashes md5 legados no login e regravando-os no novo formato.
      O schema do banco NÃO está no repositório: se a coluna de senha precisar mudar, entregue a
      migration SQL e registre explicitamente a suposição feita sobre o tamanho atual da coluna.
    expected_behavior:
      - Usuários existentes (hash md5) continuam conseguindo entrar com a senha atual.
      - Após o primeiro login, a senha fica armazenada no novo formato.
    likely_files:
      - Models/HomeMolde.php
      - Models/ajax/CadastroAluno.php
      - Models/ajax/CadastroProfessor.php
      - Models/ajax/CadastroSectario.php
    acceptance:
      - Nenhuma senha nova é gravada com md5/sha1.
      - Testes cobrem senha legada válida, legada inválida, nova válida e nova inválida.

  - id: T-005
    title: Extrair credenciais e URLs fixas de config.php para variáveis de ambiente
    requirements: [REQ-009]
    description: >
      `config.php` fixa usuário root com senha vazia e `INCLUDE_PATH` apontando para localhost.
      Ler HOST, USER, PASSWORD, DATABASE e INCLUDE_PATH de variáveis de ambiente, com os valores
      atuais como padrão para não quebrar instalações existentes, e não expor detalhes de erro de
      conexão ao usuário.
    expected_behavior:
      - Sem variáveis definidas, o sistema se comporta exatamente como antes.
      - Com variáveis definidas, elas têm precedência.
    likely_files:
      - config.php
      - Models/MySql.php
    acceptance:
      - Nenhuma credencial nova é escrita no código ou em arquivo versionado.
      - "Existe um exemplo de configuração (ex.: .env.example) sem segredos reais."

  - id: T-006
    title: Isolar o cálculo de notas e situação do aluno em código testável
    requirements: [REQ-002, REQ-007, REQ-008]
    description: >
      O cálculo de média, média parcial, recuperação e situação (aprovado, cursando, reprovado,
      reprovado por faltas) está misturado com `$_POST` e SQL em `Models/ajax/CadastroNotas.php`,
      e o rótulo da situação é repetido nas views de boletim. Extrair essa regra para código sem
      dependência de HTTP ou banco, preservando EXATAMENTE as regras atuais — inclusive a ordem de
      avaliação (média >= 60 com 4 notas aprova antes de considerar faltas) — e cobrir com testes
      de caracterização. Divergências entre a regra atual e a regra "esperada" devem ser
      registradas, não corrigidas.
    expected_behavior:
      - Para as mesmas notas, recuperações e faltas, os valores gravados são idênticos aos atuais.
      - As views exibem os mesmos rótulos de situação.
    likely_files:
      - Models/ajax/CadastroNotas.php
      - Views/pages/boletim.php
      - Views/pages/boletim-aluno.php
      - Views/pages/boletim-adm.php
    acceptance:
      - A regra de cálculo não lê superglobais nem acessa banco.
      - Testes PHPUnit cobrem nota vazia, recuperação maior e menor que a nota, média exatamente
        60, menos de 4 notas lançadas e excesso de faltas com média >= 60.
