[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atena-llm-benchmark"
version = "0.1.0"
description = "Benchmark de estratégias de LLM em engenharia de software com LangChain, LangGraph e LangSmith."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Atena LLM Benchmark"}]
dependencies = [
  "langchain>=1.1.0",
  "langgraph>=1.0.0",
  "langchain-openai>=1.4.1",
  "langchain-anthropic>=1.5.3",
  "langsmith>=0.4.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[project.scripts]
atena-bench = "atena_benchmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atena_benchmark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Conjunto explícito: o padrão do ruff muda entre versões e quebraria o CI sem mudança de código.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
