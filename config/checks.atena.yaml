# Checks VISÍVEIS aos agentes (ferramenta run_check) e executados após cada tarefa.
# Rodam em container sem rede e com o repositório montado somente-leitura: o código escrito
# pela LLM nunca executa no host. Construa a imagem antes:
#   docker build -t atena-checks:php7.3 docker/atena-checks
# Placeholders: {repo_dir} = workspace da execução; {config_dir} = diretório deste arquivo.
checks:
  php_lint:
    command: [docker, run, --rm, --network, none, -v, "{repo_dir}:/app:ro", atena-checks:php7.3, atena-lint]
    timeout_seconds: 300
    required: true

  phpunit:
    # Sem phpunit.xml/tests => exit 127 (indisponível). PHPUnit 9.6 já está no container:
    # não é preciso (nem possível) instalar via composer.
    command: [docker, run, --rm, --network, none, -v, "{repo_dir}:/app:ro", atena-checks:php7.3, atena-phpunit]
    timeout_seconds: 300
    required: false
    parser: phpunit

  phpstan:
    command: [docker, run, --rm, --network, none, -v, "{repo_dir}:/app:ro", atena-checks:php7.3, atena-phpstan]
    timeout_seconds: 600
    required: false
    parser: line_count
    line_prefix: /app/
