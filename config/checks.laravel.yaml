# Checks VISÍVEIS (PHP/Laravel): o agente roda via run_check; o harness roda no esqueleto e no final.
# Cada check chama um alvo de make da base técnica (seção 7) pelo sandbox do harness:
# dependências baixadas sem executar código do projeto; execução sem internet, com PostgreSQL
# efêmero em rede interna quando o alvo precisa de banco. Imagens: `atena-bench sandbox build-images`.
# Exit 2 do sandbox = dependências do projeto não resolveram (falha do projeto).
checks:
  lint:
    command: ["{python}", -m, atena_benchmark, sandbox, check, --tech, laravel, --target, lint, --repo, "{repo_dir}"]
    timeout_seconds: 900
    required: true
  arch:
    command: ["{python}", -m, atena_benchmark, sandbox, check, --tech, laravel, --target, arch, --repo, "{repo_dir}"]
    timeout_seconds: 600
    required: true
  test:
    command: ["{python}", -m, atena_benchmark, sandbox, check, --tech, laravel, --target, test, --repo, "{repo_dir}"]
    timeout_seconds: 1200
    required: true
  coverage:
    command: ["{python}", -m, atena_benchmark, sandbox, check, --tech, laravel, --target, coverage, --repo, "{repo_dir}"]
    timeout_seconds: 1200
    required: false
    parser: puck_metrics
