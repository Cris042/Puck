# Exemplo genérico, executando ferramentas instaladas no host. Para o Atena, prefira
# config/checks.atena.yaml (container sem rede, ferramentas com versão fixa).
# exit 0 = passed; exit em `unavailable_exit_codes` (padrão: 127) = unavailable; resto = failed.
# Placeholders aceitos nos comandos: {repo_dir} e {config_dir}.
checks:
  php_lint:
    command: ["bash", "-c", "find . -path ./vendor -prune -o -path ./Lib/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l"]
    timeout_seconds: 120
    required: true

  composer_audit:
    command: ["composer", "audit", "--no-interaction"]
    timeout_seconds: 120
    required: false

  phpunit:
    command: ["bash", "-c", "if [ -x vendor/bin/phpunit ]; then vendor/bin/phpunit; else echo 'PHPUnit não instalado'; exit 127; fi"]
    timeout_seconds: 300
    required: false
    parser: phpunit

  phpstan:
    command: ["bash", "-c", "if [ -x vendor/bin/phpstan ]; then vendor/bin/phpstan analyse --no-progress; else echo 'PHPStan não instalado'; exit 127; fi"]
    timeout_seconds: 300
    required: false

  semgrep:
    # Evite `--config auto`: as regras mudam com o tempo, exige rede e torna execuções incomparáveis.
    command: ["bash", "-c", "if command -v semgrep >/dev/null 2>&1; then semgrep scan --metrics=off --config {config_dir}/semgrep --json .; else echo 'Semgrep não instalado'; exit 127; fi"]
    timeout_seconds: 300
    required: false
    parser: semgrep_json
