# Regras locais e versionadas (não usar --config auto: muda com o tempo e exige rede).
# Cada regra mede um padrão de risco conhecido no baseline do Atena; o harness compara contagens
# baseline × final por check_id. São heurísticas: contagem menor não prova que o sistema está seguro.
rules:
  - id: sql-interpolada
    languages: [php]
    severity: ERROR
    message: SQL montado com variável interpolada/concatenada em vez de parâmetro.
    patterns:
      - pattern-either:
          - pattern: $DB->prepare($Q, ...)
          - pattern: $DB->query($Q, ...)
          - pattern: $DB->exec($Q, ...)
      - metavariable-regex:
          metavariable: $Q
          regex: '(?s)^(".*\$\w|.*\.\s*\$\w)'

  - id: hash-de-senha-fraco
    languages: [php]
    severity: ERROR
    message: md5/sha1 usado sobre senha. Use password_hash/password_verify.
    pattern-either:
      - pattern: md5(<... $_POST['senha'] ...>)
      - pattern: sha1(<... $_POST['senha'] ...>)
      - pattern: md5(<... $_POST['password'] ...>)

  - id: token-de-sessao-previsivel
    languages: [php]
    severity: WARNING
    message: Token de sessão derivado de md5 de dados previsíveis (matrícula/IP/User-Agent).
    pattern: md5(<... $_SERVER['HTTP_USER_AGENT'] ...>)

  - id: upload-sem-validacao-de-tipo
    languages: [php]
    severity: ERROR
    message: move_uploaded_file sem verificação de tipo real (finfo) no mesmo escopo.
    patterns:
      - pattern: move_uploaded_file(...)
      - pattern-not-inside: |
          function $F(...) { ... finfo_file(...); ... }
      - pattern-not-inside: |
          function $F(...) { ... mime_content_type(...); ... }

  - id: credencial-hardcoded
    languages: [php]
    severity: WARNING
    message: Credencial de banco definida no código.
    pattern-either:
      - pattern: define('PASSWORD', $V)
      - pattern: define('USER', 'root')

  - id: saida-sem-escape
    languages: [php]
    severity: WARNING
    message: Valor vindo do banco/entrada impresso sem htmlspecialchars (possível XSS).
    patterns:
      - pattern-either:
          - pattern: echo $V[$K];
          - pattern: echo $_POST[$K];
          - pattern: echo $_GET[$K];
      - pattern-not-inside: echo htmlspecialchars(...);
