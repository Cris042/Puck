# Restrições arquiteturais de examples/atena/architecture.md verificadas de forma determinística.
rules:
  - id: sql-na-view
    languages: [php]
    severity: ERROR
    message: SQL/conexão com banco dentro de View.
    paths:
      include: ["/Views/"]
    pattern-either:
      - pattern: MySql::conectar()
      - pattern: \MySql::conectar()
      - pattern: new PDO(...)

  - id: superglobal-fora-da-borda-http
    languages: [php]
    severity: ERROR
    message: >-
      Regra de negócio/persistência lendo $_POST/$_GET/$_FILES diretamente. Superglobais só são
      aceitas na borda HTTP (Controller/, Views/, Models/ajax/, index.php, gerar-pdf.php) e em testes.
    paths:
      exclude: ["/Controller/", "/Views/", "/Models/ajax/", "/index.php", "/gerar-pdf.php", "/tests/", "/Lib/"]
    pattern-either:
      - pattern: $_POST
      - pattern: $_GET
      - pattern: $_FILES
      - pattern: $_REQUEST
