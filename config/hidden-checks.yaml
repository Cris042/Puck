# Checks OCULTOS (oráculo): executados só pelo harness, no esqueleto e no final; nunca expostos
# às ferramentas dos agentes nem aos prompts. Suítes e dados ficam fora do workspace.
# Parser puck_metrics: linhas `PUCK_METRIC <nome> <inteiro>`.
checks:
  # Caracterização HTTP: contrato + regra de notas comparada ao dataset dourado do legado.
  # Exit 3 = a aplicação não subiu (falha do projeto).
  caracterizacao:
    command: ["{python}", -m, atena_benchmark, sandbox, oracle, --tech, "{tech}", --repo, "{repo_dir}"]
    timeout_seconds: 1800
    required: true
    parser: puck_metrics
