# Checks OCULTOS: o harness executa no baseline e no final, mas eles NÃO aparecem para os agentes
# (nem em run_check, nem no prompt do revisor). São o oráculo da execução: medem sem ensinar.
# As regras ficam fora do workspace ({config_dir}/semgrep), então a LLM não consegue lê-las.
checks:
  semgrep_security:
    command:
      - docker
      - run
      - --rm
      - --network
      - none
      - -v
      - "{repo_dir}:/src:ro"
      - -v
      - "{config_dir}/semgrep:/rules:ro"
      - semgrep/semgrep:1.140.0
      - semgrep
      - scan
      - --metrics=off
      - --disable-version-check
      - --config
      - /rules/atena-security.yml
      - --exclude
      - Lib/vendor
      - --exclude
      - Views/fonts
      - --json
      - --quiet
      - /src
    timeout_seconds: 600
    parser: semgrep_json

  semgrep_architecture:
    command:
      - docker
      - run
      - --rm
      - --network
      - none
      - -v
      - "{repo_dir}:/src:ro"
      - -v
      - "{config_dir}/semgrep:/rules:ro"
      - semgrep/semgrep:1.140.0
      - semgrep
      - scan
      - --metrics=off
      - --disable-version-check
      - --config
      - /rules/atena-architecture.yml
      - --exclude
      - Lib/vendor
      - --json
      - --quiet
      - /src
    timeout_seconds: 600
    parser: semgrep_json

  ajax_sem_sessao:
    command: [docker, run, --rm, --network, none, -v, "{repo_dir}:/app:ro", atena-checks:php7.3, atena-ajax-auth]
    timeout_seconds: 120
    parser: line_count
    line_prefix: Models/ajax/

  # Quando o schema MySQL estiver disponível (ver docs/ATENA_BASELINE.md), adicione aqui a suíte
  # de caracterização HTTP (golden master) mantida fora do workspace, por exemplo:
  # characterization:
  #   command: [docker, compose, -f, "{config_dir}/../docker/atena-app/compose.yaml", run, --rm, tests]
  #   parser: phpunit
